# ---------------------------------------------------------------------------
# Supervisor del contenedor de la API.
# ---------------------------------------------------------------------------
#
# Un solo contenedor, tres procesos: PHP-FPM (responde peticiones), la cola de
# Laravel (trabajos en segundo plano) y Nginx (el servidor web).
#
# POR QUE UN SOLO CONTENEDOR
# --------------------------
# Porque la cola necesita el mismo codigo y la misma configuracion que la API.
# Separarlos en dos contenedores es mejor cuando la carga es alta; aca, con una
# agencia, complica el despliegue sin ganar nada. Lo que si esta separado es el
# ROL: el worker corre su propio proceso, asi que un trabajo largo no frena las
# peticiones.
#
# OJO CON EL WORKER DE COLAS Y EL AISLAMIENTO
# --------------------------------------------
# El worker reutiliza la MISMA conexion para trabajos de agencias distintas. Por
# eso el contexto de agencia se fija con `set_config(..., true)`, o sea con
# alcance de transaccion: al terminar cada trabajo, PostgreSQL descarta el
# valor solo. Con un `SET` normal, un trabajo de una agencia leeria los datos
# de otra. Ver docs/03.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cola]
command=php /var/www/html/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --max-jobs=500
directory=/var/www/html
autostart=false
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[event:program:cola]
command=/bin/sh -c "sleep 20 && supervisorctl start cola"
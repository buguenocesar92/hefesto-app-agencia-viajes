# ---------------------------------------------------------------------------
# Archivo de configuracion de Nginx del contenedor de la API.
# ---------------------------------------------------------------------------
#
# La API no esta expuesta directamente en produccion: Caddy esta al frente y
# Nginx solo escucha dentro de la red de Docker.
#
# Lo que hace Nginx y no hacia falta otro:
#   1. No expone archivos del proyecto: solo `public/`.
#   2. No registra los cuerpos de peticion, que pueden traer datos personales.
#   3. Espera a PHP antes de responder, para que un arranque lento de PHP no
#      se vea como una API caida.

server {
    listen 8080;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Cabeceras de seguridad.
    #
    # `X-Content-Type-Options: nosniff` evita que el navegador interprete un
    # archivo como un tipo que no es. Va en toda respuesta de la API, incluso
    # en JSON.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # La API no carga CSS ni JavaScript: no necesita `connect-src` aqui. Lo que
    # si necesita es permitir que CORS (que esta al frente) hable con ella,
    # pero como no hay CORS abierto, la restriction es la mas restrictiva.
    client_max_body_size 8m;

    # En los registros de Nginx NO va el cuerpo de la peticion: puede contener
    # datos personales de un pasajero. Un log de acceso con el cuerpo es un
    # segundo lugar donde vive el dato, sin los controles del primero.
    access_log /var/log/nginx/agencia-viajes.access.log combined;
    error_log /var/log/nginx/agencia_viajes.error.log warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;

        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;

        # El parametro `SCRIPT_FILENAME` es el que le dice a PHP que archivo
        # ejecutar. Se valida que este dentro de `public/`: sin esta
        # comprobacion, una ruta mal escrita podria ejecutar un archivo de
        # mas arriba.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        fastcgi_read_timeout 60s;
    }

    # Archivos que no tienen por que servirse nunca desde el contenedor de la
    # API. A excepcion de los publicos de Laravel.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
# ---------------------------------------------------------------------------
# Configuracion de PHP-FPM del contenedor de la API.
# ---------------------------------------------------------------------------
#
# `clear_env = no`: PHP-FPM, por defecto, limpia el entorno antes de ejecutar
# PHP, y con eso las variables de `.env` de Laravel no llegan. Sin esto, la
# aplicacion arranca sin APP_KEY y sin credenciales de base de datos, y falla
# con errores que no dicen la causa.
[www]
user = www-data
group = www-data

; Una conexion por hijo. El limite de PostgreSQL no es alto: ver
; deploy/docker-compose.prod.yml.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Se avisa a la aplicacion cuando un hijo esta por morir, para que termine la
; peticion en vez de cortarla a mitad.
pm.status_path = /fpm-status

clear_env = no

catch_workers_output = yes
decorate_workers_output = no

; Registro de errores a stderr, que es lo que recoge el contenedor. El archivo
; de log de la aplicacion lo maneja Laravel, no PHP.
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on

; Registro de errores: los avisos de PHP tambien van a stderr. Un `display_errors`
; activado en produccion podria mostrar la ruta interna de un archivo en una
; respuesta de error.
php_admin_flag[display_errors] = off
php_admin_value[error_reporting] = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Limites de un archivo subido. Los documentos de viaje que sube la agencia
; son PDF e imagenes de un pasajero: no tienen por que pesar 50 megas.
upload_max_filesize = 8M
post_max_size = 8M
max_execution_time = 60
memory_limit = 256M

expose_php = Off